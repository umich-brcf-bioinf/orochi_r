# Build the image and push it to Docker Hub. Replaces Docker Hub Automated Builds,
# following https://github.com/docker/autobuilds-actions (simple-build.yaml).
#
# - Version tag push (e.g. 0.4.1): build and push umichbfxcore/orochi_r:0.4.1
# - Pull request: build only, to check the Dockerfile before it is tagged. The
#   Docker Hub login and push never run on pull requests.
name: Build and push image

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:

env:
  DOCKER_REPOSITORY_NAME: umichbfxcore/orochi_r

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # The Bioconductor-based image is about 6 GB, more than a runner has free by default
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag like 0.4.1 becomes the image tag 0.4.1; pull requests get pr-N, which is never pushed
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.DOCKER_REPOSITORY_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Record which commit produced which image, so pipelines can pin by digest
      - name: Record image digest
        if: github.event_name == 'push'
        run: |
          {
            echo "### Pushed image"
            echo ""
            echo "- Tags: \`${{ steps.meta.outputs.tags }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
